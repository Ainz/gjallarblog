name: gjallarblog-dev
services:
  gallery:
    build:
      context: ..
      dockerfile: dev/Dockerfile
    ports:
      - "127.0.0.1:8088:80"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - gallery-data:/var/www/html/_data
      - gallery-config:/var/www/html/local/config
      - gallery-uploads:/var/www/html/upload
      - ../.dev/package/gjallarblog:/var/www/html/plugins/gjallarblog:ro
  db:
    image: mariadb:11.4
    environment:
      MARIADB_RANDOM_ROOT_PASSWORD: "yes"
      MARIADB_DATABASE: piwigo
      MARIADB_USER: piwigo
      MARIADB_PASSWORD: ${DB_PASSWORD:?Run tools/Start-TestGallery.ps1 first}
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
    volumes:
      - database-data:/var/lib/mysql
volumes:
  gallery-data:
  gallery-config:
  gallery-uploads:
  database-data:
